[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careercompass"
version = "0.1.0"
description = "Pipeline ETL de vagas de TI/Dados no Brasil para portfólio de Análise de Dados"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "polars>=1.5",
    "pyarrow>=16.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
exclude = ["src/dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["src/dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
